<!-- <hr /> -->
<form [formGroup]="locationForm" (ngSubmit)="onSubmitRequest()">
  <h2><u>Location Form:</u></h2>
  
  <!-- Country -->
  <div>
    <label>Country</label>
    <br />
    <select formControlName="countryId">
      <option [ngValue]="null">Select Country</option>
      <option *ngFor="let country of countries" [ngValue]="country.id">
        {{ country.name }}
      </option>
    </select>
    
    <p *ngIf="locationForm.get('countryId')?.touched && locationForm.get('countryId')?.invalid">Country is required.</p>
  </div>
  <br />

  <!-- Division -->
  <div>
    <label>Division</label>
    <br />
    <select formControlName="divisionId">
      <option [ngValue]="null">Select Division</option>
      <option *ngFor="let division of divisions" [ngValue]="division.id">
        {{ division.name }} - {{ division.bn_name }}
      </option>
    </select>
    
    <p *ngIf="locationForm.get('divisionId')?.touched && locationForm.get('divisionId')?.invalid">Division is required.</p>
  </div>
  <br />

  <!-- District -->
  <div>
    <label>District</label>
    <br />
    <select formControlName="districtId">
      <option [ngValue]="null">Select District</option>
      <option *ngFor="let district of districts" [ngValue]="district.id">
        {{ district.name }} - {{ district.bn_name }}
      </option>
    </select>
    
    <p *ngIf="locationForm.get('districtId')?.touched && locationForm.get('districtId')?.invalid">District is required.</p>
  </div>
  <br />

  <!-- Upazila -->
  <div>
    <label>Upazila</label>
    <br />
    <select formControlName="upazilaId">
      <option [ngValue]="null">Select Upazila</option>
      <option *ngFor="let upazila of upazilas" [ngValue]="upazila.id">
        {{ upazila.name }} - {{ upazila.bn_name }}
      </option>
    </select>
    
    <p *ngIf="locationForm.get('upazilaId')?.touched && locationForm.get('upazilaId')?.invalid">Upazila is required.</p>
  </div>
  <br />

  <!-- Post Office -->
  <div>
    <label>Post Office</label>
    <br />
    <select formControlName="postCode">
      <option [ngValue]="null">Select Post Office</option>
      <option *ngFor="let item of postOffice" [ngValue]="item.postCode">
        {{ item.postOffice }} - {{ item.postCode }}
      </option>
    </select>
    
    <p *ngIf="locationForm.get('postCode')?.touched && locationForm.get('postCode')?.invalid">Post office is required.</p>
  </div>
  <br />

  <button type="submit">{{ isEditMode ? 'Update Location' : 'Add Location' }}</button>

  <!-- <hr />
  <h3>Current Form Value</h3>
  <pre>{{ locationForm.getRawValue() | json }}</pre> -->
</form>

<app-confirmation-popup></app-confirmation-popup>
