<div class="supplier-list-container">
  <div style="display: flex; justify-content: space-between; align-items: center;">
    <h2>Suppliers List:</h2>
    <div class="add-supplier-button">
      <button [routerLink]="['/supplier/create']" class="btn btn-primary">Create New Supplier</button>
    </div>
  </div>
  <table border="1" cellpadding="10" cellspacing="2">
    <thead>
      <tr>
        <th>Supplier ID</th>
        <th>Name</th>
        <th>Address</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let supplier of supplierList" [routerLink]="['/supplier', 'details', supplier.id]"
        class="clickable-row">
        <td>{{ supplier.id }}</td>
        <td>{{ supplier.name }}</td>
        <td>
          <div *ngIf="supplier.address?.country">
            <p>
              {{ getSupplierAddress(supplier) }}
            </p>
          </div>

          <div *ngIf="!supplier.address?.country">
            <p>N/A</p>
          </div>

        </td>
      </tr>
    </tbody>
  </table>
</div>
