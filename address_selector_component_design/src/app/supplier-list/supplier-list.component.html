<div class="supplier-list-container">
  <h2>Suppliers List:</h2>
  <table border="1" cellpadding="15" cellspacing="2">
    <thead>
      <tr>
        <th>Name</th>
        <th>Address</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let supplier of suppliers$ | async" [routerLink]="['/suppliers', supplier.id]" class="clickable-row">
        <td>{{ supplier.name }}</td>
        <td>{{(supplier.address?.upazila?.name || 'No address')}}</td>
      </tr>
    </tbody>
  </table>
  <div class="add-supplier-button"> <button [routerLink]="['/suppliers/new']">Add New Supplier</button></div>
</div>
